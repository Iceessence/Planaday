name: Build Native Phone (Android APK) & Windows Desktop Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_release_aab:
        description: "Build signed Android App Bundle (.aab) when repository signing secrets are configured"
        required: false
        default: false
        type: boolean

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java 21 (for Android Gradle build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify pre-installed Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install web deps, run verification gate & build Planaday PWA
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build:client

      - name: Add Capacitor 7 Android + Local Notifications (for lock-screen alarms)
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap add android
          npx cap sync android

      - name: Configure Android 4.2.0 version, R8 release shrinking, permissions & PDF/Image intent filters
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const xmlDir = "android/app/src/main/res/xml";
            fs.mkdirSync(xmlDir, { recursive: true });
            fs.writeFileSync(
              path.join(xmlDir, "network_security_config.xml"),
              `<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n  <base-config cleartextTrafficPermitted="true">\n    <trust-anchors>\n      <certificates src="system" />\n    </trust-anchors>\n  </base-config>\n</network-security-config>\n`
            );
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.CAMERA"
            ].filter((perm) => !xml.includes(perm))
             .map((perm) => `<uses-permission android:name="${perm}" />`)
             .join("\n    ");
            const camFeature = xml.includes("android.hardware.camera")
              ? ""
              : `<uses-feature android:name="android.hardware.camera" android:required="false" />`;
            if (perms || camFeature) {
              xml = xml.replace("<application", [perms, camFeature].filter(Boolean).join("\n    ") + "\n    <application");
            }
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\" android:networkSecurityConfig=\"@xml/network_security_config\"");
            }
            if (!xml.includes("application/pdf")) {
              const pdfAndScanIntents = `
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:mimeType="application/pdf" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="image/*" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="application/pdf" />
            </intent-filter>`;
              xml = xml.replace("</activity>", pdfAndScanIntents + "\n        </activity>");
            }
            fs.writeFileSync(p, xml);

            // Update versionCode / versionName to 4.2.0 & enable R8 shrinking on release builds
            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let g = fs.readFileSync(gradlePath, "utf8");
              g = g.replace(/versionCode\s+\d+/, "versionCode 420");
              g = g.replace(/versionName\s+"[^"]+"/, "versionName \"4.2.0\"");
              g = g.replace(/minifyEnabled\s+false/, "minifyEnabled true\n            shrinkResources true");
              fs.writeFileSync(gradlePath, g);
            }
          '

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Planaday-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Signed Android App Bundle (.aab) for Google Play (Optional, Secret-Gated)
        if: ${{ inputs.build_release_aab == true && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f release-keystore.jks

      - name: Upload Signed Android App Bundle (.aab)
        if: ${{ inputs.build_release_aab == true && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Planaday-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run verification gate & build Planaday web bundle
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build:client

      - name: Copy built web bundle into desktop wrapper
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force dist desktop/web

      - name: Install desktop dependencies & package portable Windows .exe
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Downloadable Windows Desktop App (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Planaday-Windows-Desktop-App
          path: desktop/release/*.exe
